<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجّل اهتمامك | AsirX</title><link rel="stylesheet" href="/static/css/pages.css"></head><body><header><a class="logo" href="/">Asir<b>X</b></a><nav><a href="/destinations/">الوجهات</a><a href="/tours-360/">جولات 360°</a></nav><a class="top-btn" href="/">الرئيسية</a></header><main><section class="page-intro"><span class="big-icon">🌿</span><p>كن من أوائل المستخدمين</p><h1>سجّل اهتمامك</h1><p>لن نرسل عروضًا تسويقية دون موافقتك المنفصلة.</p></section><section class="content narrow"><form id="standaloneInterest" class="large-form"><label>الاسم الكامل *<input name="name" autocomplete="name" required></label><label>رقم الجوال *<input name="phone" type="tel" inputmode="tel" placeholder="05xxxxxxxx" required></label><label>المدينة *<input name="city" required></label><label>الخدمة المهتم بها *<select name="experience" required><option value="">اختر الخدمة</option><option>جولات 360°</option><option>المساعد الذكي</option><option>تخطيط الرحلات</option><option>الفنادق والمنتجعات</option><option>الوجهات السياحية</option><option>المطاعم والمقاهي</option><option>الفعاليات والتجارب</option></select></label><label>الوجهة المرغوبة *<select name="destination" required><option value="">اختر الوجهة</option><option>رجال ألمع</option><option>السودة</option><option>أبها</option><option>الحبلة</option><option>غير محدد</option></select></label><label>موعد السفر المتوقع<input name="travel_date" type="date"></label><label>عدد المسافرين<input name="travelers" type="number" min="1" max="30"></label><label>الميزانية التقريبية (اختياري)<select name="budget"><option value="">غير محددة</option><option>أقل من 2,000 ريال</option><option>2,000–5,000 ريال</option><option>5,000–10,000 ريال</option><option>أكثر من 10,000 ريال</option></select></label><label class="full-field">ملاحظات إضافية<textarea name="notes" rows="4" maxlength="1000"></textarea></label><label class="wide-check"><input name="privacy_consent" type="checkbox" required> أوافق على حفظ بياناتي والتواصل معي بخصوص تجربة AsirX.</label><label class="wide-check"><input name="marketing_consent" type="checkbox"> أوافق بشكل منفصل على استقبال العروض التسويقية.</label><button class="btn block" type="submit">سجّل اهتمامي</button><div id="standaloneMessage" class="notice" role="alert" aria-live="polite"></div></form></section></main><script src="/static/js/pages.js"></script></body></html>
