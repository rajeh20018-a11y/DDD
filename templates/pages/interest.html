<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجّل اهتمامك | AsirX</title><link rel="stylesheet" href="/static/css/pages.css"></head><body><header><a class="logo" href="/">Asir<b>X</b></a><nav><a href="/destinations/">الوجهات</a><a href="/tours-360/">جولات 360°</a></nav><a class="top-btn" href="/">الرئيسية</a></header><main><section class="page-intro"><span class="big-icon">🌿</span><p>كن من أوائل المستخدمين</p><h1>سجّل اهتمامك</h1><p>أرسل بياناتك بأمان وسنتواصل معك قريبًا بالتجربة المناسبة.</p></section><section class="content narrow"><form id="standaloneInterest" class="detail-form"><div class="form-section-title"><span>01</span><div><h2>البيانات الأساسية</h2><p>أدخل معلومات التواصل الخاصة بك</p></div></div><label>الاسم الكامل <small class="required">إجباري</small><input name="name" required></label><label>رقم الجوال <small class="required">إجباري</small><input name="phone" type="tel" inputmode="tel" placeholder="05xxxxxxxx" required></label><label>المدينة <small class="required">إجباري</small><input name="city" required></label><div class="form-section-title"><span>02</span><div><h2>تفاصيل الرحلة</h2><p>ساعدنا في معرفة التجربة المناسبة لك</p></div></div><label>ما الوجهة التي ترغب بزيارتها في عسير؟ <small class="required">إجباري</small><select name="destination" required><option value="">اختر الوجهة</option><option>رجال ألمع</option><option>السودة</option><option>أبها</option><option>الحبلة</option><option>غير محدد</option></select></label><label>ما نوع التجربة التي تهمك؟ <small class="required">إجباري</small><select name="experience" required><option value="">اختر نوع التجربة</option><option>الطبيعة والجبال</option><option>المنتجعات والفنادق</option><option>المطاعم والمقاهي</option><option>المغامرات</option><option>الفعاليات</option></select></label><label>موعد الزيارة المتوقع <small class="optional">اختياري</small><input name="travel_date" type="date"></label><label>عدد المسافرين <small class="optional">اختياري</small><input name="travelers" type="number" min="1" max="30" placeholder="مثال: 2"></label><label>الميزانية التقريبية <small class="optional">اختياري</small><select name="budget"><option value="">غير محددة</option><option>اقتصادية</option><option>متوسطة</option><option>مرنة</option></select></label><label>ملاحظات <small class="optional">اختياري</small><textarea name="notes" rows="3" placeholder="أي تفاصيل تساعدنا على خدمتك"></textarea></label><label class="check"><input name="privacy_consent" type="checkbox" required> أوافق على حفظ بياناتي والتواصل معي بخصوص تجربة AsirX.</label><label class="check"><input name="marketing_consent" type="checkbox"> أوافق على استقبال أحدث الوجهات والعروض.</label><button class="btn block" type="submit">إرسال الطلب</button><div id="standaloneMessage" aria-live="polite"></div></form></section></main><script src="/static/js/pages.js"></script></body></html>
