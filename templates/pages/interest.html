<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجّل اهتمامك | AsirX</title><link rel="stylesheet" href="/static/css/pages.css"></head><body><header><a class="logo" href="/">Asir<b>X</b></a><nav><a href="/destinations/">الوجهات</a><a href="/tours-360/">جولات 360°</a></nav><a class="top-btn" href="/">الرئيسية</a></header><main><section class="page-intro"><span class="big-icon">🌿</span><p>كن من أوائل المستخدمين</p><h1>سجّل اهتمامك</h1><p>سنستخدم بياناتك للتواصل بشأن التجربة فقط، ولن نرسل عروضًا تسويقية دون موافقتك.</p></section><section class="content narrow"><form id="standaloneInterest" class="large-form"><label>الاسم *<input name="name" required></label><label>رقم الجوال *<input name="phone" type="tel" placeholder="05xxxxxxxx" required></label><label>المدينة *<input name="city" required></label><label>القسم الذي تهتم به *<select name="experience" required><option value="">اختر القسم</option><option>جولات 360°</option><option>المساعد الذكي</option><option>تخطيط الرحلات</option><option>الفنادق والمنتجعات</option><option>الوجهات السياحية</option><option>المطاعم والمقاهي</option><option>الفعاليات والتجارب</option></select></label><label>الوجهة المرغوبة *<select name="destination" required><option>غير محدد</option><option>رجال ألمع</option><option>السودة</option><option>أبها</option><option>الحبلة</option></select></label><label>موعد السفر المتوقع<input name="travel_date" type="date"></label><label class="wide-check"><input name="privacy_consent" type="checkbox" required> أوافق على سياسة الخصوصية وحفظ بياناتي للتواصل بشأن التجربة.</label><label class="wide-check"><input name="marketing_consent" type="checkbox"> أوافق على استقبال العروض التسويقية.</label><button class="btn block">سجّل اهتمامي</button><div id="standaloneMessage" class="notice"></div></form></section></main><script src="/static/js/pages.js"></script></body></html>
