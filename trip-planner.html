<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تخطيط الرحلات | AsirX</title><link rel="stylesheet" href="/static/css/pages.css"></head><body><header><a class="logo" href="/">Asir<b>X</b></a><nav><a href="/destinations.html">الوجهات</a><a href="/hotels.html">الفنادق</a></nav><a class="top-btn" href="/interest.html">سجّل اهتمامك</a></header><main><section class="page-intro"><span class="big-icon">🗺️</span><p>خطتك في دقائق</p><h1>صمّم رحلتك إلى عسير</h1><p>أدخل تفضيلاتك وسننشئ لك برنامجًا سياحيًا أوليًا.</p></section><section class="content"><form id="fullPlanner" class="large-form"><label>مدة الرحلة<input name="days" type="number" min="1" max="7" value="3" required></label><label>الميزانية<select name="budget"><option>اقتصادية</option><option selected>متوسطة</option><option>مرنة</option></select></label><label>عدد المسافرين<input name="travelers" type="number" min="1" max="30" value="2" required></label><label>نوع الرحلة<select name="type"><option>عائلية</option><option>أصدقاء</option><option>فردية</option><option>مغامرات</option></select></label><fieldset><legend>الاهتمامات</legend><label><input type="checkbox" name="interests" value="تراثية" checked> التراث</label><label><input type="checkbox" name="interests" value="طبيعية"> الطبيعة</label><label><input type="checkbox" name="interests" value="مطاعم"> الطعام</label></fieldset><button class="btn block" type="submit">أنشئ رحلتي</button></form><div id="fullPlanResult" class="results" aria-live="polite"></div></section></main><script src="/static/js/pages.js"></script></body></html>
